[package]
name = "gix-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Independent workspace on purpose. This crate must NOT join the gitoxide
# workspace: doing so would unify `gix` feature selection with gitoxide-core
# and the gix CLI, which carry a compile_error! for
# blocking-client + async-client together.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features stay ON: this is the exact set validated by the
# `cargo +nightly rustdoc --output-format json` run. `parallel` is not
# optional - without it `gix::Repository` is not `Send`.
gix = { path = "../gix", features = [
    "parallel",
    "attributes",
    "revision",
    "blame",
    "merge",
    "status",
    "dirwalk",
    "index",
    "worktree-mutation",
    "blocking-network-client",
] }
gix-shallow = { path = "../gix-shallow" }
interoptopus_mps = { version = "0.18.0", registry = "local" }

[dev-dependencies]
interoptopus_csharp_mps = { version = "0.18.0", registry = "local" }

# interoptopus is the fork published to the local registry: packages
# `interoptopus_mps` and `interoptopus_csharp_mps`, registry alias `local`,
# declared per machine in $CARGO_HOME/config.toml under [registries.local].
# The lib name is still `interoptopus`, so `use interoptopus::...` is unchanged.
# The package name differs from crates.io, so the upstream crate can never be
# substituted silently.
